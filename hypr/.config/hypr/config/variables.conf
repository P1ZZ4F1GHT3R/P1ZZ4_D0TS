# GLOBAL VARIABLES & CONSTANTS

# APPLICATION VARIABLES
$mainMod = SUPER
$secondMod = ALT
$terminal = ghostty
$fileManager = thunar
$browser = zen-browser
$launcher = vicinae
$volumeBrightness = ~/.config/scripts/media/volume-brightness.sh

# DIRECTORY PATHS
$configDir = ~/.config/hypr
$scriptsDir = ~/.config/scripts
$wallpaperDir = ~/Pictures/wallpapers
$screenshotDir = ~/Pictures/Screenshots

# THEME VARIABLES
$cursorTheme = Vimix
$cursorSize = 32
$fontFamily = SF Pro
$fontMono = Liga SFMono Nerd Font

# LAYOUT CONSTANTS
$gapsIn = 5
$gapsOut = 10
$borderSize = 3
$rounding = 10
$masterRatio = 0.6
$scrollingRatio = 0.6

# ANIMATION TIMING
$animSpeed = 3
$animSpeedFast = 2
$animSpeedSlow = 5

# OPACITY VALUES
$opacityActive = 1.0
$opacityInactive = 0.8
$opacityFloat = 0.90
$opacitySpecial = 0.6
$scrollingRatio = 0.6

# TIMEOUT VALUES (in seconds)
$timeoutDim = 300000      # 5 minutes
$timeoutLock = 600000     # 10 minutes
$timeoutScreen = 900000   # 15 minutes
$timeoutSuspend = 1200000 # 20 minutes


# DUAL GPU SETUP
env = AQ_DRM_DEVICES,/dev/dri/primary_gpu:/dev/dri/secondary_gpu